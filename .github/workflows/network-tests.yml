name: Network Tests

on:
  workflow_dispatch:
  schedule:
    - cron: "0 9 * * 1"

permissions:
  contents: read

jobs:
  test:
    runs-on: [self-hosted, macOS, ssgrep-mac-mini]
    timeout-minutes: 20
    env:
      UV_PYTHON: "3.11"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Set up uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9
        with:
          version: "0.13.5"
          enable-cache: true

      - name: Install Python 3.11
        run: uv python install 3.11

      - name: Sync dependencies
        run: uv sync --locked

      # External download/transport smoke is opt-in/scheduled, not native-agent
      # authorization and not a substitute for the required pinned-model lane.
      - name: Run explicit network lane
        run: uv run poe test-network
