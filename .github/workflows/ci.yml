name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fast-core:
    # No wall-time claim until measured on this concurrency-1 runner.
    runs-on: [self-hosted, ssgrep]
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        # Preserve the tested floor/newer versions and their required check names.
        python: ["3.11", "3.13"]
    env:
      UV_PYTHON: ${{ matrix.python }}
      COVERAGE_FILE: .coverage.core
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Set up uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9
        with:
          enable-cache: true
      - name: Sync pinned dependencies and record interpreter
        run: |
          uv python install "${{ matrix.python }}"
          uv sync --locked
          uv run python -V
          uv run python -V | grep -q "Python ${{ matrix.python }}."
      - name: Static merge gates
        if: matrix.python == '3.11'
        run: |
          uv run poe lint
          uv run poe fmt
          uv run poe typecheck
          uv run poe sizecheck
          uv run poe deptry
      - name: Fast ledger, security and fault regressions
        run: uv run poe test-core
      - name: Retain core coverage for required full-suite gate
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: core-coverage-${{ matrix.python }}
          path: .coverage.core
          include-hidden-files: true
          if-no-files-found: error

  test-macos:
    # Preserve existing required check names. Every change conservatively runs
    # heavy integration; no changed product/test/config path can bypass it.
    needs: fast-core
    # Required check must fail, not become a successful skip, when core fails.
    if: ${{ always() }}
    runs-on: [self-hosted, ssgrep]
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        # Tested floor/newer versions; not a claim about latest Python support.
        python: ["3.11", "3.13"]
    env:
      # Without this `uv sync` resolves the newest interpreter satisfying
      # requires-python (>=3.11), so BOTH legs ran 3.13 and the "3.11" leg
      # never tested the floor version.
      UV_PYTHON: ${{ matrix.python }}
    steps:
      - name: Require every core matrix leg
        run: test '${{ needs.fast-core.result }}' = success
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Set up uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9
        with:
          enable-cache: true

      - name: Assert interpreter is ${{ matrix.python }}
        run: |
          uv python install "${{ matrix.python }}"
          uv run python -V
          uv run python -V | grep -q "Python ${{ matrix.python }}."

      - name: Sync dependencies
        run: uv sync --locked

      - name: Restore same-revision core coverage
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: core-coverage-${{ matrix.python }}

      - name: Prepare required Docker integrations
        run: |
          docker info >/dev/null
          uv run python - <<'PY'
          import subprocess
          from tests.accounting.otel_collector_lab import IMAGE as OTEL_IMAGE
          from tests.accounting.prom_lab import IMAGE as PROM_IMAGE
          for image in (OTEL_IMAGE, PROM_IMAGE):
              subprocess.run(["docker", "pull", image], check=True)
          PY

      - name: Prepare pinned embedding snapshot
        run: |
          uv run python - <<'PY'
          from huggingface_hub import snapshot_download
          from ssgrep.indexing.embed import DEFAULT_MODEL_ID, DEFAULT_MODEL_REVISION
          snapshot_download(repo_id=DEFAULT_MODEL_ID, revision=DEFAULT_MODEL_REVISION, max_workers=2)
          PY

      - name: Fail required integration on unavailable prerequisites
        run: |
          uv run python - <<'PY'
          from tests.accounting.otel_collector_lab import unavailable_reason
          from tests.accounting.prom_lab import docker_available
          problems = [reason for reason in (unavailable_reason(), docker_available()) if reason]
          if problems:
              raise SystemExit("BLOCKED required integration:\n" + "\n".join(problems))
          PY

      - name: Heavy integration and combined full-suite 100% coverage
        run: |
          uv run coverage combine .coverage.core
          uv run poe test-heavy

      - name: Verify CLI identity
        run: |
          set -euo pipefail

          # Build the wheel
          uv build --wheel

          # Create a fresh venv and install the wheel (non-editable).
          # Use `uv run python` so the interpreter exists on both hosted
          # runners (setup-python) and the self-hosted runner (uv-managed).
          VENV_DIR=$(mktemp -d)
          uv run python -m venv "$VENV_DIR"
          VENV_PIP="$VENV_DIR/bin/pip"

          # Install the built wheel
          WHEEL=$(find dist -name "*.whl" -type f | head -1)
          $VENV_PIP install "$WHEEL"

          # Move to a directory outside the repo to test real user scenario
          TEST_DIR=$(mktemp -d)
          cd "$TEST_DIR"

          # Test all three identity surfaces
          # 1. Check --version (strip path to get name field only)
          VERSION_OUTPUT=$("$VENV_DIR/bin/ssgrep" --version)
          VERSION_NAME=$(echo "$VERSION_OUTPUT" | sed 's/ *(.*//')
          echo "$VERSION_NAME" | grep -i "ssgrep" || (echo "FAIL: --version does not contain ssgrep"; exit 1)
          if echo "$VERSION_NAME" | grep -iq "usecli"; then
            echo "FAIL: --version shows usecli instead of ssgrep"
            exit 1
          fi

          # 2. Check version subcommand
          SUBVER_OUTPUT=$("$VENV_DIR/bin/ssgrep" version 2>&1)
          echo "$SUBVER_OUTPUT" | grep -i "ssgrep" || (echo "FAIL: version subcommand does not contain ssgrep"; exit 1)
          if echo "$SUBVER_OUTPUT" | grep -iq "usecli"; then
            echo "FAIL: version subcommand shows usecli instead of ssgrep"
            exit 1
          fi

          # 3. Check about - look for Cli Name line specifically
          ABOUT_OUTPUT=$("$VENV_DIR/bin/ssgrep" about)
          echo "$ABOUT_OUTPUT" | grep "Cli Name" | grep -i "ssgrep" || (echo "FAIL: about Cli Name does not contain ssgrep"; exit 1)
          if echo "$ABOUT_OUTPUT" | grep "Cli Name" | grep -iq "usecli"; then
            echo "FAIL: about shows usecli as Cli Name"
            exit 1
          fi

          # 4. Ensure inspire (usecli's demo command) is NOT exposed
          HELP_OUTPUT=$("$VENV_DIR/bin/ssgrep" --help)
          if echo "$HELP_OUTPUT" | grep -iq "inspire"; then
            echo "FAIL: usecli's inspire command is exposed"
            exit 1
          fi

          # Cleanup
          rm -rf "$VENV_DIR" "$TEST_DIR"

          echo "PASS: CLI identity is correct (ssgrep)"

  test-ubuntu-smoke:
    # One Linux smoke leg (Python 3.12) exercises filesystem, process and
    # permission semantics independently of the macOS matrix. The
    # self-hosted runner is macOS (job-level `container:` is Linux-runner
    # only), so the suite runs inside an explicit `docker run` of a real
    # Linux image; this executes even while GitHub-hosted runners are
    # billing-blocked.
    runs-on: [self-hosted, ssgrep]
    # Includes dependency setup, the full suite under amd64 emulation, and wheel verification.
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: "Linux root semantics and portable full suite in an isolated container"
        run: |
          set -euo pipefail
          # SSGREP_EVAL_WORKERS=2: the eval harness's per-query ProcessPool defaults
          # to up to 16 workers, each importing torch; in this ~8 GB emulated VM that
          # OOM-kills a worker (BrokenProcessPool) on a run that passes everywhere else.
          docker run --rm --platform linux/amd64 \
            -v "$PWD:/source:ro" -w /repo \
            -e UV_PYTHON=3.12 \
            -e SSGREP_EVAL_WORKERS=2 \
            -e UV_PROJECT_ENVIRONMENT=/tmp/ssgrep-venv \
            catthehacker/ubuntu:act-latest \
            bash -lc '
              set -euo pipefail
              echo "=== copy read-only sources into container-owned workspace ==="
              mkdir -p /repo
              tar -C /source --exclude=.venv --exclude=.ruff_cache --exclude=dist \
                --exclude=.pytest_cache --exclude=".coverage*" -cf - . | tar -C /repo -xf -
              test "$(id -u)" = 0
              test "$(uname -s)" = Linux
              echo "=== install uv ==="
              curl -LsSf https://astral.sh/uv/install.sh | sh >/dev/null 2>&1
              export PATH="$HOME/.local/bin:$PATH"
              uv --version
              # Limit uv concurrency: the Docker VM (~8GB) OOMs on a parallel
              # 103-package uv sync (exit 137). Serialize the build/install.
              export UV_CONCURRENT_BUILDS=1 UV_CONCURRENT_INSTALLS=1 UV_LINK_MODE=copy
              echo "=== uv sync --locked ==="
              timeout 600 uv sync --locked >/dev/null 2>&1 && echo "SYNC OK" || { echo "SYNC FAIL"; exit 1; }
              # Lint/format/size are platform-independent and already ran once.
              # Keep the Linux dependency/platform-sensitive type check.
              echo "=== LINUX TYPECHECK ==="; timeout 300 uv run poe typecheck
              echo "=== PREPARE PINNED EMBEDDING SNAPSHOT ==="
              export HF_HOME="$HOME/.cache/huggingface"
              timeout 600 uv run python -c "from huggingface_hub import snapshot_download; from ssgrep.indexing.embed import DEFAULT_MODEL_ID, DEFAULT_MODEL_REVISION; snapshot_download(repo_id=DEFAULT_MODEL_ID, revision=DEFAULT_MODEL_REVISION, max_workers=2)"
              export PIP_CACHE_DIR=/tmp/pipwarm
              # Keep every test and complete logs; no Docker socket is exposed.
              # Docker/sandbox-only skips here do not satisfy their required macOS lane.
              echo "=== PORTABLE FULL SUITE (Linux/root) ==="; timeout 5400 uv run poe test
              echo "=== VERIFY CLI IDENTITY ==="
              uv build --wheel >/dev/null 2>&1
              VENV_DIR=$(mktemp -d)
              uv run python -m venv "$VENV_DIR"
              WHEEL=$(find dist -name "*.whl" -type f | head -1)
              "$VENV_DIR/bin/pip" install -q "$WHEEL"
              TEST_DIR=$(mktemp -d); cd "$TEST_DIR"
              "$VENV_DIR/bin/ssgrep" --version | grep -i ssgrep >/dev/null || { echo "FAIL version"; exit 1; }
              "$VENV_DIR/bin/ssgrep" version 2>&1 | grep -i ssgrep >/dev/null || { echo "FAIL subver"; exit 1; }
              ABOUT_OUTPUT=$("$VENV_DIR/bin/ssgrep" about)
              echo "$ABOUT_OUTPUT" | grep "Cli Name" | grep -i ssgrep
              if echo "$ABOUT_OUTPUT" | grep "Cli Name" | grep -iq usecli; then
                echo "FAIL usecli leak"; exit 1
              fi
              HELP_OUTPUT=$("$VENV_DIR/bin/ssgrep" --help)
              if echo "$HELP_OUTPUT" | grep -qi inspire; then
                echo "FAIL inspire leak"; exit 1
              fi
              echo "PASS: CLI identity is correct (ssgrep)"
            '
