name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  # Never cancel a push to main mid-run; superseded PR runs may be cancelled.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  fast-core:
    # No wall-time claim until measured on this concurrency-1 runner.
    runs-on: [self-hosted, ssgrep]
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        # Preserve the tested floor/newer versions and their required check names.
        python: ["3.11", "3.13"]
    env:
      UV_PYTHON: ${{ matrix.python }}
      COVERAGE_FILE: .coverage.core
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Set up uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9
        with:
          version: "0.13.5"
          enable-cache: true
      - name: Sync pinned dependencies and record interpreter
        run: |
          uv python install "${{ matrix.python }}"
          uv sync --locked
          uv run python -V
          uv run python -V | grep -q "Python ${{ matrix.python }}."
      - name: Static merge gates
        if: matrix.python == '3.11'
        run: |
          uv run poe lint
          uv run poe fmt
          uv run poe typecheck
          uv run poe sizecheck
          uv run poe deptry
      - name: Fast ledger, security and fault regressions
        run: uv run poe test-core
      - name: Retain core coverage for required full-suite gate
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: core-coverage-${{ matrix.python }}
          path: .coverage.core
          include-hidden-files: true
          if-no-files-found: error

  test-macos:
    # Preserve existing required check names. Every change conservatively runs
    # heavy integration; no changed product/test/config path can bypass it.
    needs: fast-core
    # Required check must fail, not become a successful skip, when core fails.
    if: ${{ always() }}
    runs-on: [self-hosted, ssgrep]
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        # Tested floor/newer versions; not a claim about latest Python support.
        python: ["3.11", "3.13"]
    env:
      # Without this `uv sync` resolves the newest interpreter satisfying
      # requires-python (>=3.11), so BOTH legs ran 3.13 and the "3.11" leg
      # never tested the floor version.
      UV_PYTHON: ${{ matrix.python }}
    steps:
      - name: Require every core matrix leg
        run: test '${{ needs.fast-core.result }}' = success
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Set up uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9
        with:
          version: "0.13.5"
          enable-cache: true

      - name: Assert interpreter is ${{ matrix.python }}
        run: |
          uv python install "${{ matrix.python }}"
          uv run python -V
          uv run python -V | grep -q "Python ${{ matrix.python }}."

      - name: Sync dependencies
        run: uv sync --locked

      - name: Restore same-revision core coverage
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: core-coverage-${{ matrix.python }}

      - name: Prepare required Docker integrations
        run: |
          docker info >/dev/null
          uv run python - <<'PY'
          import subprocess
          from tests.accounting.export.otel_collector_lab import IMAGE as OTEL_IMAGE
          from tests.accounting.serve.prom_lab import IMAGE as PROM_IMAGE
          for image in (OTEL_IMAGE, PROM_IMAGE):
              subprocess.run(["docker", "pull", image], check=True)
          PY

      - name: Prepare pinned embedding snapshot
        run: |
          uv run python - <<'PY'
          from huggingface_hub import snapshot_download
          from ssgrep.indexing.embed import DEFAULT_MODEL_ID, DEFAULT_MODEL_REVISION
          snapshot_download(repo_id=DEFAULT_MODEL_ID, revision=DEFAULT_MODEL_REVISION, max_workers=2)
          PY

      - name: Fail required integration on unavailable prerequisites
        run: |
          uv run python - <<'PY'
          from tests.accounting.export.otel_collector_lab import unavailable_reason
          from tests.accounting.serve.prom_lab import docker_available
          problems = [reason for reason in (unavailable_reason(), docker_available()) if reason]
          if problems:
              raise SystemExit("BLOCKED required integration:\n" + "\n".join(problems))
          PY

      - name: Heavy integration and combined full-suite 100% coverage
        run: |
          uv run coverage combine .coverage.core
          uv run poe test-heavy

      - name: Verify installed CLI identity
        # The wheel is installed with only its own runtime dependencies (from
        # PyPI) into a venv outside the checkout, so a CLI importing a dev-only
        # package fails here. The surface checks live in one place: the script.
        run: |
          set -euo pipefail
          work=$(mktemp -d "$RUNNER_TEMP/cli-identity.XXXXXX")
          trap 'rm -rf "$work"' EXIT
          uv build --wheel --out-dir "$work/dist"
          wheels=("$work"/dist/*.whl)
          test "${#wheels[@]}" -eq 1
          mkdir "$work/run"
          cd "$work/run"
          uv venv --no-config --python "$UV_PYTHON" "$work/venv"
          uv pip install --no-config --python "$work/venv/bin/python" "${wheels[0]}"
          "$GITHUB_WORKSPACE/scripts/check_cli_identity.sh" "$work/venv/bin/ssgrep"

  dagger-check:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, macOS, ssgrep-mac-mini]
    timeout-minutes: 90
    env:
      DAGGER_ENGINE: tcp://127.0.0.1:1234
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          # Dagger mounts the workspace's Git metadata for the hygiene test; a
          # shallow clone lacks the parent commits it needs to materialize it.
          fetch-depth: 0

      - name: Install pinned Dagger CLI
        env:
          DAGGER_VERSION: v1.0.0-beta.21
          # sha256 of dagger_v1.0.0-beta.21_darwin_arm64.tar.gz, from the
          # release's published checksums.txt.
          DAGGER_SHA256: 781f4862c022a19b9a4c498b59e1d9cfda1ee3cdc8ce210e4545bd8842a7416d
        run: |
          set -euo pipefail
          test "$(uname -sm)" = "Darwin arm64"
          bin="$RUNNER_TEMP/dagger-bin"
          tarball="$RUNNER_TEMP/dagger_${DAGGER_VERSION}_darwin_arm64.tar.gz"
          rm -rf "$bin" "$tarball"
          mkdir -p "$bin"
          curl -fsSL --proto '=https' -o "$tarball" \
            "https://dl.dagger.io/dagger/releases/${DAGGER_VERSION#v}/dagger_${DAGGER_VERSION}_darwin_arm64.tar.gz"
          # Fail closed: shasum -c exits non-zero on any mismatch.
          echo "$DAGGER_SHA256  $tarball" | shasum -a 256 -c -
          tar -xzf "$tarball" -C "$bin" dagger
          rm -f "$tarball"
          echo "$bin" >> "$GITHUB_PATH"
          "$bin/dagger" version | grep -F "1.0.0-beta.21"

      - name: Generate Dagger module SDK and clients
        # sdk/ and clients/ are generated, not committed.
        run: dagger generate -y

      - name: Run Dagger checks on the mini's local engine
        run: dagger check --parallel 3 --progress plain
