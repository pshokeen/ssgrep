name: Deps image

# Publishes the Linux dependency image the Dagger lane starts from (a cache seed:
# the lane still runs the locked sync, model prefetch and an interpreter check on
# top, and ignores the image if its base differs from the checkout's) and opens a
# pull request that rewrites .dagger/modules/ssgrep-ci/src/ssgrep_ci/pin.py.
#
# Module-code changes are deliberately not a push trigger: rerun by hand
# (workflow_dispatch) after changing the environment recipe; the weekly schedule
# also refreshes OS packages.

on:
  schedule:
    - cron: "17 5 * * 1"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - pyproject.toml
      - uv.lock
      - .github/workflows/deps-image.yml

concurrency:
  group: deps-image
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      image: ${{ steps.names.outputs.image }}
      stem: ${{ steps.names.outputs.stem }}
      lock_hash: ${{ steps.names.outputs.lock_hash }}
      base: ${{ steps.names.outputs.base }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - id: names
        run: |
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          lock_hash="$(cat pyproject.toml uv.lock | sha256sum | cut -c1-8)"
          # <UTC time>-r<run id>-<lock hash>: lexical order is chronological, and the run id makes
          # it unique even within one second. A re-run of failed jobs keeps these outputs.
          stem="$(date -u +%Y%m%d%H%M%S)-r${GITHUB_RUN_ID}-${lock_hash}"
          {
            echo "image=ghcr.io/${owner}/ssgrep-ci-deps"
            echo "lock_hash=${lock_hash}"
            echo "stem=${stem}"
            # The base image of the revision being built, not of whatever main is later.
            echo "base=$(python3 scripts/deps_image.py base)"
          } >> "$GITHUB_OUTPUT"

  build:
    needs: prepare
    name: build (${{ matrix.arch }})
    # Each architecture builds natively; nothing here relies on CPU emulation. The
    # arm64 build follows CI_RUNS_ON (the Mac mini, whose engine is Linux/arm64) and
    # otherwise uses GitHub's hosted arm64 runner.
    runs-on: ${{ fromJSON(matrix.runs-on) }}
    timeout-minutes: 90
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            runs-on: ${{ vars.CI_RUNS_ON || '"ubuntu-24.04-arm"' }}
            engine: ${{ vars.DAGGER_ENGINE }}
          - arch: amd64
            runs-on: '"ubuntu-latest"'
            engine: ""
    env:
      # An engine endpoint is only reachable from the host it was configured for.
      DAGGER_ENGINE: ${{ matrix.engine }}
      IMAGE: ${{ needs.prepare.outputs.image }}
      STEM: ${{ needs.prepare.outputs.stem }}
      LOCK_HASH: ${{ needs.prepare.outputs.lock_hash }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Install pinned Dagger CLI
        run: |
          sh scripts/install_dagger.sh "$RUNNER_TEMP/dagger-bin"
          echo "$RUNNER_TEMP/dagger-bin" >> "$GITHUB_PATH"

      - name: Generate Dagger module SDK and clients
        run: dagger generate -y

      - name: Authenticate to GHCR (job-local Docker config)
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          config="$RUNNER_TEMP/docker-config"
          mkdir -p "$config"
          chmod 700 "$config"
          auth="$(printf '%s:%s' "$GITHUB_ACTOR" "$GHCR_TOKEN" | base64 | tr -d '\n')"
          echo "::add-mask::$auth"
          printf '{"auths":{"ghcr.io":{"auth":"%s"}}}\n' "$auth" > "$config/config.json"
          chmod 600 "$config/config.json"
          echo "DOCKER_CONFIG=$config" >> "$GITHUB_ENV"

      - name: Build and publish the ${{ matrix.arch }} image
        run: |
          out="$(dagger call ssgrep-ci deps-image \
            --revision "$GITHUB_SHA" \
            --lock-hash "$LOCK_HASH" \
            --source-url "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" \
            publish --address "$IMAGE:$STEM-${{ matrix.arch }}" --progress plain)"
          ref="$(printf '%s\n' "$out" | grep -Eo '[^[:space:]]+@sha256:[0-9a-f]{64}' | tail -n 1)"
          test -n "$ref"
          echo "Published $ref"

      - name: Remove job-local Docker config
        if: always()
        run: rm -rf "$RUNNER_TEMP/docker-config"

  join:
    needs: [prepare, build]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    outputs:
      digest: ${{ steps.index.outputs.digest }}
    env:
      IMAGE: ${{ needs.prepare.outputs.image }}
      STEM: ${{ needs.prepare.outputs.stem }}
    steps:
      - name: Log in to GHCR
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: printf '%s' "$GHCR_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin

      - name: Each variant has the architecture its tag claims
        run: |
          for arch in arm64 amd64; do
            actual="$(docker buildx imagetools inspect "$IMAGE:$STEM-$arch" --format '{{json .Image}}' \
              | jq -r .architecture)"
            echo "$IMAGE:$STEM-$arch -> $actual"
            test "$actual" = "$arch"
          done

      - name: Join into one multi-architecture reference
        id: index
        run: |
          docker buildx imagetools create -t "$IMAGE:$STEM" "$IMAGE:$STEM-arm64" "$IMAGE:$STEM-amd64"
          digest="$(docker buildx imagetools inspect "$IMAGE:$STEM" --format '{{json .Manifest}}' | jq -r .digest)"
          test -n "$digest"
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
          echo "Index $IMAGE:$STEM -> $digest"

  verify:
    # The amd64 proof: a hosted (amd64) engine pulls the joined reference through the
    # module and runs real checks on top of it. The arm64 proof is the pin pull
    # request's own dagger-check on the mini.
    needs: [prepare, join]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Install pinned Dagger CLI
        run: |
          sh scripts/install_dagger.sh "$RUNNER_TEMP/dagger-bin"
          echo "$RUNNER_TEMP/dagger-bin" >> "$GITHUB_PATH"

      - name: Authenticate to GHCR (job-local Docker config)
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          config="$RUNNER_TEMP/docker-config"
          mkdir -p "$config"
          chmod 700 "$config"
          auth="$(printf '%s:%s' "$GITHUB_ACTOR" "$GHCR_TOKEN" | base64 | tr -d '\n')"
          echo "::add-mask::$auth"
          printf '{"auths":{"ghcr.io":{"auth":"%s"}}}\n' "$auth" > "$config/config.json"
          chmod 600 "$config/config.json"
          echo "DOCKER_CONFIG=$config" >> "$GITHUB_ENV"

      - name: Pin the new digest in this checkout only
        env:
          REF: ${{ needs.prepare.outputs.image }}@${{ needs.join.outputs.digest }}
          BASE: ${{ needs.prepare.outputs.base }}
        run: |
          python3 scripts/deps_image.py write-pin --image "$REF" --base "$BASE"
          cat .dagger/modules/ssgrep-ci/src/ssgrep_ci/pin.py

      - name: Generate Dagger module SDK and clients
        run: dagger generate -y

      - name: Run checks on top of the image
        run: dagger check --check lint --check typecheck --check tests-eval --progress plain

      - name: Remove job-local Docker config
        if: always()
        run: rm -rf "$RUNNER_TEMP/docker-config"

  pin:
    needs: [prepare, join, verify]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      pull-requests: write
      actions: write
    env:
      GH_TOKEN: ${{ github.token }}
      STEM: ${{ needs.prepare.outputs.stem }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: main
          persist-credentials: false

      - name: Open the pin pull request
        env:
          REF: ${{ needs.prepare.outputs.image }}@${{ needs.join.outputs.digest }}
          BASE: ${{ needs.prepare.outputs.base }}
        # Attempt-numbered branches let a re-run recover after a push that succeeded but a
        # pull request that did not; see scripts/deps_image.py `propose`.
        run: |
          python3 scripts/deps_image.py propose \
            --ref "$REF" --base "$BASE" --stem "$STEM" --attempt "$GITHUB_RUN_ATTEMPT"

  retain:
    # Keep the eight newest builds plus the build main pins and this run's candidate; delete
    # nothing while main has no pin, and refuse (deleting nothing) if the pin is not in the
    # package. The policy and its tests live in scripts/deps_image.py and tests/ci.
    needs: [prepare, pin]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
    env:
      GH_TOKEN: ${{ github.token }}
      OWNER: ${{ github.repository_owner }}
      STEM: ${{ needs.prepare.outputs.stem }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: main
          persist-credentials: false

      - name: Delete old builds
        run: python3 scripts/deps_image.py retain --owner "$OWNER" --candidate "$STEM"
