[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ssgrep"
version = "2.0.1"
description = "Search and grep AI coding-session transcripts without an LLM"
keywords = ["session-search", "retrieval", "cli", "transcript", "offline"]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Operating System :: POSIX",
  "Operating System :: POSIX :: Linux",
  "Operating System :: MacOS",
  "Topic :: Software Development",
  "Topic :: System",
  "Topic :: Utilities",
]
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = [
  "apsw==3.54.0.0",
  "chonkie==1.7.0",
  "cocoindex>=1.0.20",
  "fastmcp==3.4.4",
  "huggingface-hub>=1.24.0",
  "lancedb==0.37.1",
  "numpy==2.4.6",
  "platformdirs==4.11.0",
  "pyarrow>=25.0.1",
  "pylate>=1.6.0",
  "pydantic>=2.13.4",
  "rich>=15.0.0",
  "scipy>=1.14.0",
  "sentence-transformers==5.3.0",
  "torch==2.11.0",
  "tqdm>=4.69.1",
  "transformers>=4.41.0,<5.4.0",
  "typer==0.27.0",
  "usecli==0.1.78",
]

# PEP 735 dependency group, NOT a PEP 621 extra. `uv sync` installs groups by
# default but never installs extras — declaring these under
# [project.optional-dependencies] silently uninstalls the toolchain and breaks
# every `uv run poe ...` invocation, locally and in CI.
[dependency-groups]
dev = [
  "pytest-benchmark==4.0.0",
  "bandit>=1.9.4",
  "deptry>=0.25.1",
  "isort>=8.0.1",
  "poethepoet>=0.48.0",
  "prometheus-client>=0.26.0",
  "pytest>=9.1.1",
  "pytest-cov>=7.1.0",
  "ruff>=0.16.2",
  "ty>=0.0.70",
  "usechange>=0.1.46",
  "ir-measures==0.4.3",
  "pytrec-eval-terrier==0.5.10",
  "data-designer==0.9.1",
  "pandas>=2.3.3",
]

[project.urls]
Homepage = "https://github.com/pshokeen/ssgrep"
Repository = "https://github.com/pshokeen/ssgrep"
Changelog = "https://github.com/pshokeen/ssgrep/blob/main/CHANGELOG.md"
Issues = "https://github.com/pshokeen/ssgrep/issues"

[project.scripts]
ssgrep = "usecli:main"
sg = "usecli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/ssgrep"]
exclude = ["*.bak", "*.orig", "*.fixed"]

[tool.hatch.build.targets.sdist]
only-include = ["src", "README.md", "LICENSE"]

[tool.uv]
required-version = ">=0.11.32"
# data-designer (dev) declares pyarrow<25 and rich<15 upper bounds that conflict
# with ssgrep's runtime pins (pyarrow>=25.0.1, rich>=15.0.0). The library verifiably
# imports and runs against our newer versions; overriding the upper bounds keeps the
# two installable in one environment. Track via `uv add` regression check after edits.
override-dependencies = ["pyarrow>=25.0.1", "rich>=15.0.0"]


# Linux resolves torch from the PyTorch CPU index so `uv sync` never pulls the
# multi-GB CUDA stack (the Linux CI smoke job runs on an 8GB Docker VM with a
# 600s sync timeout). macOS keeps the PyPI wheel, which is CPU/MPS already.
[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.isort]
profile = "black"
line_length = 100
known_first_party = ["ssgrep"]
combine_as_imports = true

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.isort]
known-first-party = ["ssgrep"]
combine-as-imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
  "slow: heavyweight integration; all marked tests remain in the required core/heavy partition",
  "network: external-network opt-in, excluded from offline merge coverage",
]
addopts = "-m \"not network\""

[tool.coverage.run]
parallel = true
# usecli loads command files by their basename, outside the ssgrep module namespace.
# Match their real source directory as well, even when pytest uses --cov=ssgrep.
source_dirs = ["src/ssgrep"]
# JSON error paths and crash-recovery drivers deliberately bypass atexit.
patch = ["subprocess", "_exit"]

[tool.deptry]
known_first_party = ["ssgrep"]
# sentence-transformers is a runtime dependency of the LanceDB embedding
# function / reranker and the CocoIndex embedder op; ssgrep never imports it
# directly (that is the point of using the built-ins).
# data-designer / pandas / ir-measures / prometheus-client are dev-only
# validation tooling imported by first-party eval/ modules; they must
# never ship as runtime deps of the ssgrep wheel.

[tool.deptry.per_rule_ignores]
DEP002 = ["ssgrep", "sentence-transformers"]
DEP004 = ["data_designer", "ir_measures", "pandas", "prometheus_client"]
# usecli (pinned exactly) raises click's Exit from the help path that cli/usecli_compat.py corrects.
DEP003 = ["click"]


[tool.poe.tasks]
# Run the ssgrep CLI directly (dev convenience)
dev = "uv run ssgrep"
# Full hygiene pass: sort imports, auto-fix lint, format, dep check, typecheck
clean-full = "sh -c 'uv run isort . && uv run ruff check . --fix && uv run ruff format . && uv run deptry . && uv run ty check'"
# Quick pass: sort imports and format only
clean = "sh -c 'uv run isort . && uv run ruff format .'"
# Run the test suite verbosely
test = "uv run pytest tests/ -v"
# Run tests with 100% coverage gate (fails if under)
test-cov = "uv run pytest tests/ -v --cov=ssgrep --cov-report=term-missing --cov-fail-under=100"
# Complementary path lanes: unmarked/new tests stay in core unless explicitly moved.
# Existing slow tests live in the heavy paths; do not deselect slow tests globally.
# Core retains ledger, security and injected-fault regressions, including subprocess controls.
test-core = """uv run pytest tests/ -v -m "not network"
  --ignore=tests/indexing --ignore=tests/pipeline --ignore=tests/store
  --ignore=tests/search --ignore=tests/eval --ignore=tests/cli --ignore=tests/services
  --ignore=tests/accounting/export/test_otel_collector.py
  --ignore=tests/accounting/export/test_otel_delivery.py
  --ignore=tests/accounting/serve/test_metrics_scrape.py
  --cov=ssgrep --cov-report= --cov-fail-under=0"""
# Append core coverage from the same revision/interpreter, then enforce the full gate.
# This command alone is not a release pass: test-core must have succeeded first.
test-heavy = """uv run pytest
  tests/indexing tests/pipeline tests/store tests/search tests/eval tests/cli tests/services
  tests/accounting/export/test_otel_collector.py
  tests/accounting/export/test_otel_delivery.py
  tests/accounting/serve/test_metrics_scrape.py
  -v -m "not network"
  --cov=ssgrep --cov-append --cov-report=term-missing --cov-fail-under=100"""
test-network = 'uv run pytest tests/ -v -m "network"'
# Sort imports only
sort = "uv run isort ."
# Lint with ruff (no auto-fix)
lint = "uv run ruff check ."
# Format check only (CI); `format` rewrites files
fmt = "uv run ruff format --check ."
# File-size gate: src/**/*.py warns above 300 / fails above 400 code lines; accounting package and accounting CLI renderer/JSON modules warn above 600 / fail above 800
sizecheck = "uv run python scripts/check_file_size.py"
# Repo hygiene gate: no agent-tool state, internal docs, or build junk
# tracked in git (open-source release requirement)
hygiene = "uv run pytest tests/test_repo_hygiene.py -v"
# Format code with ruff
format = "uv run ruff format ."
# Check for unused/missing dependencies
deptry = "uv run deptry ."
# Type-check the codebase
typecheck = "uv run ty check"
# Audit dependencies for known vulnerabilities
audit = "uv audit"
# Static security scan with bandit
security = "uv run bandit -r . -x './.venv/*'"
# Full local merge gate retains standalone full-suite 100% coverage.
# CI partitions collection into core/heavy without weakening this release gate.
ci = "sh -c 'uv run poe lint && uv run poe fmt && uv run poe typecheck && uv run poe sizecheck && uv run poe deptry && uv run poe test-cov'"
# Changelog-driven version bump and release
release = "uv run usechange release"

# ---- retrieval eval ----
# Profile live-corpus distribution -> profile.json (stratification target)
eval-profile = "uv run python -m eval.datasetgen.profile_live $POE_EXTRA_ARGS"
# Preview synthetic session generation (8 samples)
eval-gen-preview = "uv run python -m eval.datasetgen.workflow --mode preview -n 8 $POE_EXTRA_ARGS"
# Generate the full synthetic sessions corpus (sessions.parquet)
eval-gen-sessions = "uv run python -m eval.datasetgen.workflow --mode create $POE_EXTRA_ARGS"
# Generate labelled queries + holdout split -> queries.jsonl
eval-gen-queries = "uv run python -m eval.datasetgen.generate_queries $POE_EXTRA_ARGS"
# LLM-as-judge grading of query-episode pairs -> qrels
eval-judge = "uv run python -m eval.datasetgen.judge_qrels $POE_EXTRA_ARGS"
# End-to-end benchmark ingestion (builds index from dataset dir)
eval-ingest = "uv run python -m eval.datasetgen.ingest $POE_EXTRA_ARGS"
# Freeze immutable benchmark artifact (manifest + BEIR export)
eval-freeze = "uv run python -m eval.datasetgen.freeze $POE_EXTRA_ARGS"
# Verify the frozen dataset against its sha256 manifest
eval-verify = "uv run python -m eval.datasetgen.freeze --verify $POE_EXTRA_ARGS"
# Run full retrieval eval against frozen v2 dataset
eval-run = "uv run python -m eval.run_eval --dataset v2 --arm default $POE_EXTRA_ARGS"
# Quick smoke eval run (fast subset)
eval-smoke = "uv run python -m eval.run_eval --dataset v2 --arm default --quick $POE_EXTRA_ARGS"
# Run eval and compare against the v2 baseline
eval-baseline = "uv run python -m eval.run_eval --dataset v2 --arm default --baseline eval/results/baseline_v2.json $POE_EXTRA_ARGS"
# Run eval with reference (ground-truth) scoring
eval-reference = "uv run python -m eval.run_eval --dataset v2 --arm default --with-reference $POE_EXTRA_ARGS"
# Diff two eval payloads; exits 1 when a gate is breached
eval-compare = "uv run python -m eval.compare $POE_EXTRA_ARGS"
# Run the eval-specific test suite quietly
eval-test = "uv run pytest tests/eval -q"

